name: Android Release

on:
  push:
    branches:
      - bilibili
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Extract Version Info
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION_NAME-build${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Sign APK (Optional - currently using unsigned/debug if no keys)
        # Note: To sign properly, you would need to add secrets to your repository:
        # KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
        # For now, we'll just rename the unsigned output or build debug for testing
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk SponsorSkip-v${{ steps.get_version.outputs.version_name }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            # If release build fails due to missing keys, fallback to debug for the action's artifact
            cp app/build/outputs/apk/debug/app-debug.apk SponsorSkip-v${{ steps.get_version.outputs.version_name }}-debug.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.version_name }} (Build ${{ github.run_number }})
          body: |
            自動構建版本。
            Commit: ${{ github.sha }}
            Build Number: ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            SponsorSkip-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
